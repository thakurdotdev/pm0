name: ci

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "test/**"
      - "scripts/**"
      - "npm/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "test/**"
      - "scripts/**"
      - "npm/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          # Own cache below: setup-go's key is shared by every job, so only
          # the first job to finish saves it and the others restore a cache
          # built for different flags.
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/staticcheck
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-lint-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          # Pinned: "latest" re-resolves and rebuilds every run. Bump on
          # purpose. install-go: false reuses the go.mod toolchain and the
          # build cache go vet just warmed instead of installing a second Go.
          version: "v0.8.2"
          install-go: false
          use-cache: false # covered by the actions/cache step above

  test:
    # Daily driver: unit tests + pgid fallback under -race.
    # Cgroup-dependent tests auto-skip here (no delegated cgroup v2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false # own cache below (race builds differ from lint's)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
      - name: race tests
        run: go test -race -count=1 ./...

  cgroup-v2-privileged:
    # cgroup v2 delegated environment: exercises cgroup-kill and cgroup-freeze
    # kill paths. Flaky infra is expected (plan risk #4); failure here does not
    # block the build, but it must be loud.
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ubuntu:24.04
      # --cgroupns=host: the host's cgroupfs is bind-mounted below, so the
      # container must see host cgroup paths in /proc/self/cgroup too.
      # With a private cgroupns the paths don't match the mount and the
      # kernel blocks moving children into app cgroups.
      options: --privileged --cgroupns=host
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
    steps:
      - uses: actions/checkout@v4
      - name: install build dependencies
        run: apt-get update && apt-get install -y gcc libc6-dev ca-certificates git
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: report cgroup topology
        run: |
          cat /proc/self/cgroup || true
          mount | grep cgroup || true
      - name: kill-path tests incl. cgroup
        run: go test -race -count=1 -v ./internal/proc/...

  golden-pm2:
    # Compat contract assertions against REAL pm2 (docs/compat.md §2/§3).
    # Non-blocking: pm2 is the reference implementation, drift here is loud
    # but must not block pm2go development.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install pm2
        run: npm install -g pm2
      - name: golden assertions vs real pm2
        run: node scripts/golden-pm2-check.js pm2
